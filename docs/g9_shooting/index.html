# ⑨ シューティングゲーム

パターン：クローンでふやす

*Scratch 体験ワークショップ*

---

# なにをするの？

:::

**ロケット**から弾をうって、やってくる**敵**をうちおとそう。

- ロケットは、矢印キーで左右に動く
- **スペースキー**で弾をうつ
- 敵が下まで来たら、ゲームオーバー

> このゲームのポイントは「**クローンでふやす**」だよ。

:::

📷 ここに画面：完成したシューティングゲーム（ロケットから弾が出て、上から敵が来るステージ）

---

# このゲームのしくみ

:::

**登場するもの**

- **ロケット**（Rocketship）… 矢印キーで左右に動く
- **弾** … スペースキーで、**クローン**がつぎつぎ出る
- **敵** … 上からおりてくる

**ルール**

1. 弾が敵に当たったら、得点が 1 ふえて、敵は上にもどる
2. 敵が下まで来たら、ゲームオーバー

:::

📷 ここに画面：ロケット・弾・敵に、それぞれの役わりを書きこんだもの

---

# じゅんび

:::

1. **Rocketship** を出して、大きさ **50**、名前を「**ロケット**」にする
2. 「**描く**」で、黄色い小さな四角の「**弾**」をかく
3. 敵にするキャラクターを出して、名前を「**敵**」にする
4. ネコは「**削除**」、背景は宇宙に
5. 変数「**得点**」を作る

:::

📷 ここに画面：スプライトの一覧に ロケット・弾・敵 がならんでいるところ

---

# ロケット：左右に動く

:::

g3 の「かご」と同じだよ。

1. 緑の旗 →「**x座標を 0 、y座標を -140 にする**」
2. 「**ずっと**」の中に「**もし 〜 なら**」を2つ
3. 右向き矢印で x を **10**、左向き矢印で x を **-10** ずつ変える

:::

📷 ここにブロックの画面：ロケットのスクリプト

---

# 弾：本体はロケットについていく

:::

1. 緑の旗 →「**隠す**」→「**ずっと**」
2. 中に「**どこかの場所 へ行く**」を入れ、▼ で「**ロケット**」をえらぶ
3. その下に「**もし スペース キーが押された なら**」
4. 口に「**自分自身 のクローンを作る**」と「**0.3 秒待つ**」

> 本体は隠れたまま、ロケットの場所で弾のクローンを作りつづけるんだ。

:::

📷 ここにブロックの画面：弾の「緑の旗が押されたとき」のスクリプト

---

# 弾：クローンが飛んでいく

:::

1. 「**クローンされたとき**」→「**表示する**」
2. 「**40 回繰り返す**」の中に「**y座標を 10 ずつ変える**」
3. その下に「**もし 敵 に触れた なら**」→「**あたり を送る**」→「**このクローンを削除する**」
4. くりかえしの下にも「**このクローンを削除する**」

> 当たらなかった弾も、上まで行ったら消す。消さないと、クローンがたまっていくよ。

:::

📷 ここにブロックの画面：弾の「クローンされたとき」のスクリプト

---

# 敵：おりてくる

:::

**スクリプト①**：緑の旗 → 得点を 0 → x を **乱数**、y を **170** →「**ずっと**」

- 中に「**y座標を -3 ずつ変える**」
- 「**もし （y座標） < -170 なら**」→「**ざんねん! と 1 秒言う**」→「**すべてを止める**」

**スクリプト②**：「**あたり を受け取ったとき**」→ 得点を 1 ふやす → 音 → x を乱数、y を 170 にする

:::

📷 ここにブロックの画面：敵の2本のスクリプト

---

# 🎮 あそんで勝負しよう

:::

**⚔ 勝負** … 何体うちおとせるかな？

1. 緑の旗でスタート
2. ゲームオーバーになったときの「**得点**」が記録
3. となりの人と交代して、記録をくらべる
4. 3回やって、いちばんよい記録で勝負！

:::

📷 ここに画面：ゲームオーバーになったステージと「得点」

---

# 💪 改造してみよう

:::

1. 弾をうつときに音を鳴らす
2. 得点が上がるほど、敵を速くする
3. 敵を2体にする（「**複製**」）
4. 敵を、左右にゆれながらおりてくるようにする
5. 「0.3 秒待つ」を変えて、連射のはやさを調整する

> これでゲーム編はおしまい！ 次は拡張機能編。ペンや音楽、カメラも使えるよ。

:::

📷 ここに画面：敵が2体になったステージ
