# ③ キャッチゲーム

パターン：落ちてくるものを受けとめる

*Scratch 体験ワークショップ*

---

# なにをするの？

:::

上から落ちてくる**りんご**を、**かご**で受けとめよう。

- かごは、矢印キーで左右に動く
- 受けとめたら**得点**
- 落としたら、**ゲームオーバー**

> このゲームのポイントは「**落ちてくるものを受けとめる**」だよ。

:::

📷 ここに画面：完成したキャッチゲーム（りんごが落ちてきて、下にかごがあるステージ）

---

# このゲームのしくみ

:::

**登場するもの**

- **かご**（Bowl）… 矢印キーで左右に動く
- **りんご**（Apple）… 上から落ちてくる

**ルール**

1. りんごが、ランダムな場所から落ちてくる
2. かごにふれたら得点が 1 ふえて、また上から落ちてくる
3. 下まで落ちたら、ゲームオーバー

:::

📷 ここに画面：かごとりんごに、それぞれの役わりを書きこんだもの

---

# じゅんび

:::

1. 「**スプライトを選ぶ**」で、**Bowl**（かご）と **Apple**（りんご）を出す
2. ネコは、右クリックして「**削除**」
3. 好きな背景をえらぶ
4. 変数「**得点**」を作る

> 名前の検索欄に「bowl」「apple」と入れると、早く見つかるよ。

:::

📷 ここに画面：スプライトの一覧に Bowl と Apple がならんでいるところ

---

# 新しいブロック：「y座標」

:::

「**動き**」のいちばん下に、まるい「**y座標**」のブロックがあるよ。

- いまいる場所の **y の数** が入っている
- 「**演算**」の「**〇 < 〇**」と組み合わせると、「下まで来たか」を調べられる

「**もし （y座標） < -170 なら**」… y が -170 より小さい＝ステージの**いちばん下**まで来た

> 「**x座標**」のブロックもあるよ。こちらは横の場所だね。

:::

📷 ここにブロックの画面：「動き」のいちばん下の「x座標」「y座標」と、「もし （y座標） < -170 なら」

---

# かご：左右に動く

:::

c2 の「キーでなめらかに動かそう」の、**左右だけ**だよ。

1. 緑の旗 →「**x座標を 0 、y座標を -140 にする**」
2. 「**ずっと**」の中に「**もし 〜 なら**」を2つ
3. 「**右向き矢印 キーが押された**」なら「**x座標を 10 ずつ変える**」
4. 「**左向き矢印 キーが押された**」なら「**x座標を -10 ずつ変える**」

:::

📷 ここにブロックの画面：かごのスクリプト

---

# りんご：落ちてくる

:::

1. 緑の旗 →「**得点 を 0 にする**」→ x を **-200〜200 の乱数**、y を **170** にする
2. 「**ずっと**」の中に「**y座標を -5 ずつ変える**」
3. 「**もし Bowl に触れた なら**」→ 得点を 1 ふやす・音・**上にもどす**
4. 「**もし （y座標） < -170 なら**」→「**ざんねん! と 1 秒言う**」→「**すべてを止める**」

> 上にもどすときも、x は乱数にしよう。

:::

📷 ここにブロックの画面：りんごのスクリプト（1本にまとめたもの）

---

# 🎮 あそんで勝負しよう

:::

**⚔ 勝負** … 落とすまでに、何個とれるかな？

1. 緑の旗でスタート
2. 落としたときの「**得点**」が記録
3. となりの人と交代して、記録をくらべる
4. 3回やって、いちばんよい記録で勝負！

:::

📷 ここに画面：「ざんねん!」と言って止まったステージと「得点」

---

# 💪 改造してみよう

:::

1. 落ちる速さを **-8** にして、むずかしくする
2. 得点が上がるほど速くする（速さを変数にしよう）
3. 「**ライフ**」を作って、**3回**落としたらおしまいにする
4. 2つ目のりんごを足す（スプライトを「**複製**」）
5. とったら「**ピッチ の効果**」で音を高くしていく

:::

📷 ここに画面：りんごが2つ落ちてくるステージ
