# ① ネコを動かそう（動き）

向きと場所を、数字で決めよう

*Scratch 体験ワークショップ*

---

# なにをするの？

:::

青い「**動き**」のブロックで、ネコを思いどおりの場所に動かそう。

- ネコの**向き**を数字で決める
- ステージの**場所**を x と y であらわす
- 緑の旗で**スタートの位置**にもどす
- **すーっと**動かす

:::

![青い「動き」のブロックたち](image/index/02_motion.png)

---

# 向きを変えよう

:::

1. 「**動き**」の「**90 度に向ける**」をコードエリアに置く
2. 白い丸のところをクリックして、数字を変える
3. ブロックをクリック

- **90** … 右
- **0** … 上
- **-90** … 左
- **180** … 下

> 白い丸をクリックすると、時計のような丸い目盛りも出るよ。矢印を回しても決められるんだ。

:::

![矢印が右を向いているから 90。矢印を回してもいいよ](image/index/03_direction.png)

---

# ステージの場所は x と y

:::

ステージの場所は、**2つの数字**であらわすよ。

- **x** … 横の場所。右へ行くほど大きい（-240〜240）
- **y** … たての場所。上へ行くほど大きい（-180〜180）
- **まん中**は x が 0、y が 0

右下の「**背景を選ぶ**」で「**Xy-grid**」をえらぶと、目もりが見えるよ。

:::

![背景を「Xy-grid」にすると、x と y の目もりが見えるよ](image/index/04_xygrid.png)

---

# いまの場所をたしかめよう

:::

ネコが**いまどこにいるか**は、右下の**スプライトの画面**でわかるよ。

- 「**x**」… いまの横の場所
- 「**y**」… いまのたての場所

1. ステージのネコを**ドラッグ**する
2. 右下の「**x**」と「**y**」の数字が変わるのを見る
3. Xy-grid の目もりと、数字がだいたい合っているかたしかめる

> ブロックで動かしたときも、この数字が変わるよ。

:::

![ネコは x -100・y 100 の目もりのところ。右下の数字も -100 と 100 だね](image/index/05_position.png)

---

# 場所を決めよう

:::

1. 「**動き**」の「**x座標を 0 、y座標を 0 にする**」を置く
2. 白い丸に数字を入れる（例：x に **200**、y に **100**）
3. ブロックをクリック

ネコが、その場所に**ワープ**するよ。

> ブロックのならぶところでは、いまネコがいる場所の数字が、はじめから入っているよ。

:::

![x が 200、y が 100 の目もりが交わるところにワープしたよ](image/index/05_warp.png)

---

# スタートの位置にもどそう

:::

i3 では、動いたネコを手でもどしたね。プログラムでもどそう。

1. 「**（緑の旗）が押されたとき**」を置く
2. 下に「**x座標を 0 、y座標を 0 にする**」をつなぐ
3. その下に「**90 度に向ける**」をつなぐ

> 作品のはじめに「場所」と「向き」を決めておくのは、よく使うワザだよ。これから何回も出てくるよ。

:::

![緑の旗を押すと、まん中で右を向いたネコにもどるよ](image/index/06_start.png)

---

# 少しずつ動かそう

:::

いまの場所から、**少しだけ**動かすこともできるよ。

- 「**x座標を 10 ずつ変える**」… 右へ 10
- 「**y座標を 10 ずつ変える**」… 上へ 10

左や下へ動かしたいときは、**-10** のようにマイナスにするよ。

> 「10 歩動かす」は、ネコが向いている方へ進むブロック。こちらは、向きに関係なく右や上に動くよ。

:::

![緑の旗を押すたびに、右へ 10・上へ 10 動くよ](image/index/07_change.png)

---

# すーっと動かそう

:::

ワープではなく、**すべるように**動かすブロックもあるよ。

- 「**1 秒で どこかの場所 へ行く**」
- 「**1 秒でx座標を 200 に、y座標を 100 に変える**」

秒の数を大きくすると、**ゆっくり**動くよ。

> 「どこかの場所」の ▼ をクリックすると、「**マウスのポインター**」もえらべるよ。

:::

![どちらも、1秒かけてすーっと動くよ](image/index/08_glide.png)

---

# 🎮 ミニゲーム：ぴったりワープ

:::

**🔮 予想** … 2人1組。一発でぴったり重ねられたら勝ち！

1. 1人が「**スプライトを選ぶ**」で目印（りんごなど）を出し、ステージのどこかに置く
2. もう1人は、Xy-grid の目もりを見て、目印の x と y を**予想**する
3. 予想した x と y をブロックに入れて、クリック（すーっと動くブロックでもOK）
4. ネコが目印にぴったり重なったら勝ち！ 交代しよう

> ⚠ 予想する人は、右下の「x」「y」の数字を見ちゃだめだよ。

:::

![目もりを見て、りんごの x と y を予想しよう](image/index/09_game.png)

---

# やってみよう

:::

ネコに、ステージの**四すみ**を回らせよう。

1. 「スタートの位置にもどそう」のスクリプトを作る
2. 「**1 秒でx座標を … に、y座標を … に変える**」を4つつなぐ
3. 左上 → 右上 → 右下 → 左下 の順に回るように数字を入れる
4. 最後に、まん中にもどす
5. 秒の数を変えて、速さを変える

> すみぎりぎり（240 と 180）だと、ネコがはみ出しちゃう。例では少し内側の 190 と 130 にしたよ。

:::

![四すみを回るスクリプトの例](image/index/11_corners.png)
