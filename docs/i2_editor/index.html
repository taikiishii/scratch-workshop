# ② 画面の見かたをおぼえよう

どこに何があるかを知ろう

*Scratch 体験ワークショップ*

---

# なにをするの？

:::

プログラムを作る画面を**エディター**というよ。

この章でおぼえること。

- エディターの**ひらきかた**
- 言語を「**日本語**」にする
- **ステージ**と**スプライト**
- **ブロック**のならぶところと、置くところ

:::

![これがエディター。どこに何があるか、この章でおぼえよう](image/index/02_editor.png)

---

# エディターをひらこう

:::

1. ブラウザをひらく
2. アドレスに **scratch.mit.edu** と入れる
3. Scratch のトップページの「**作ってみよう**」をクリック
4. ネコがいる画面が出たら OK！

> いちばん上の「**作る**」をクリックしても、同じ画面がひらくよ。

:::

![トップページの「作ってみよう」をクリック](image/index/03_top.png)

---

# 言語を「日本語」にしよう

:::

1. 上のメニューの「**設定**」をクリック
2. 「**言語**」をえらぶ
3. 一覧を下へスクロールして「**日本語**」をクリック（Nederlands のすぐ下）

> ⚠ 「**にほんご**」（ひらがな）もあるけど、この教材は漢字の「**日本語**」にそろえているよ。

:::

![「日本語」にチェックがついていれば OK。すぐ下が「にほんご」だよ](image/index/04_language.png)

---

# 画面の全体を見てみよう

:::

エディターは、大きく **5つ** に分かれているよ。

1. **メニュー** … 保存や設定
2. **ブロックのならぶところ** … 使えるブロック
3. **コードエリア** … ブロックを置くところ
4. **ステージ** … 作品が動くところ
5. **スプライトのならぶところ** … 登場するキャラクター

:::

![番号は、左の説明の番号と同じだよ](image/index/05_parts.png)

---

# ステージ

:::

**ステージ**は、作品が動く**舞台**だよ。右上にある。

- **緑の旗** … プログラムをスタート
- **赤いボタン** … ぜんぶ止める
- **全画面表示** … ステージを大きくする

> 緑の旗は、作品をはじめる「**よーい、ドン！**」の合図なんだ。

:::

![ステージの左上に緑の旗と赤いボタン、右上に全画面表示](image/index/06_stage.png)

---

# スプライトとステージ

:::

**スプライト**は、ステージに出てくる**役者**。はじめはネコがいるよ。

- **名前** … はじめは「Sprite1」
- **x・y** … ステージのどこにいるか
- **大きさ** … 100 がふつうの大きさ
- **向き** … どっちを向いているか

> スプライトはいくつでもふやせるよ。右下の「**スプライトを選ぶ**」から。

:::

![右下で、スプライトの名前や場所・大きさ・向きがわかるよ](image/index/07_sprite.png)

---

# ブロックのカテゴリー

:::

ブロックは、**色ごと**に分かれているよ。

- 「**動き**」… 青
- 「**見た目**」… むらさき
- 「**音**」… ピンク
- 「**イベント**」… 黄色
- 「**制御**」… オレンジ
- 「**調べる**」… 水色
- 「**演算**」… 緑
- 「**変数**」… こいオレンジ
- 「**ブロック定義**」… 赤

:::

![左はしの丸をクリックすると、その色のブロックが出てくるよ](image/index/08_category.png)

---

# 3つのタブ

:::

左上の **タブ** で、作るものを切りかえるよ。

- 「**コード**」… プログラム
- 「**コスチューム**」… 見た目の絵
- 「**音**」… 鳴らす音

> 右下で「**ステージ**」をえらんでいるときは、「コスチューム」のタブが「**背景**」に変わるよ。

:::

![左上のタブで、作るものを切りかえるよ](image/index/09_tabs.png)

---

# 🎮 ミニゲーム：場所あて早押し

**⚔ 勝負** … メンターが言った場所を、先に**指でさした**人の勝ち！

- 緑の旗
- 赤いボタン
- ネコの「**大きさ**」
- 「**イベント**」のブロック
- 「**音**」のタブ
- 「**スプライトを選ぶ**」
- 「**設定**」

> 何問とれたか数えておこう。全部わかったら、エディターの画面はばっちりだよ！
