# ④ よけろ！ゲーム

パターン：よけつづける

*Scratch 体験ワークショップ*

---

# なにをするの？

:::

空からふってくる**いん石**を、よけてよけて、よけまくろう！

- いん石は**3つ**。速さもばらばら
- ふれたら、**ゲームオーバー**
- **生きのこった時間**が記録

> このゲームのポイントは「**よけつづける**」だよ。

:::

📷 ここに画面：完成したよけろ！ゲーム（いん石が3つ落ちてきて、下にネコがいるステージ）

---

# このゲームのしくみ

:::

**登場するもの**

- **ネコ** … 矢印キーで左右に動く
- **いん石**（Rocks）… 3つ。上から落ちてくる
- **ステージ** … 生きのこった時間を数える

**ルール**

1. いん石が、ランダムな場所から落ちてくる
2. 下まで来たら、また上から落ちてくる
3. ネコにふれたら、ゲームオーバー

:::

📷 ここに画面：ネコ・いん石・ステージに、それぞれの役わりを書きこんだもの

---

# じゅんび

:::

1. 「**スプライトを選ぶ**」で、**Rocks**（いん石）を出す
2. ネコの「**大きさ**」を **50** にして、名前の欄を「**ネコ**」にする
3. 宇宙など、好きな背景をえらぶ
4. 変数「**生きのこり**」を作る

> いん石はまだ1つでOK。スクリプトができてから、ふやすよ。

:::

📷 ここに画面：ネコと Rocks がいて、宇宙の背景をえらんだステージ

---

# ネコ：左右によける

:::

g3 の「かご」と同じだよ。

1. 緑の旗 →「**x座標を 0 、y座標を -140 にする**」
2. 「**ずっと**」の中に「**もし 〜 なら**」を2つ
3. 「**右向き矢印 キーが押された**」なら「**x座標を 10 ずつ変える**」
4. 「**左向き矢印 キーが押された**」なら「**x座標を -10 ずつ変える**」

:::

📷 ここにブロックの画面：ネコのスクリプト

---

# いん石：落ちてくる

:::

1. 緑の旗 → x を **-200〜200 の乱数**、y を **170** にする
2. 「**ずっと**」の中に「**y座標を -6 ずつ変える**」
3. 「**もし （y座標） < -170 なら**」→ また上にもどす
4. 「**もし ネコ に触れた なら**」→「**終わるまで … の音を鳴らす**」→「**すべてを止める**」

> 「y座標」のブロックは、g3 で使ったね。

:::

📷 ここにブロックの画面：いん石のスクリプト

---

# いん石を3つにふやす

:::

1. 右下のいん石を**右クリック**して「**複製**」
2. もう一度「**複製**」して、3つにする
3. 2つ目は **-8**、3つ目は **-4** にして、速さをばらばらにする

> スプライトを「複製」すると、**スクリプトもいっしょに**コピーされるよ。

:::

📷 ここに画面：スプライトの一覧で、Rocks を右クリックして「複製」をえらんでいるところ

---

# ステージ：生きのこった時間

:::

1. 右下の「**ステージ**」をクリック
2. 緑の旗 →「**生きのこり を 0 にする**」
3. 「**ずっと**」の中に「**1 秒待つ**」と「**生きのこり を 1 ずつ変える**」

> いん石にふれると「すべてを止める」で、この数も止まるよ。止まったときの数が記録だね。

:::

📷 ここにブロックの画面：ステージのスクリプト

---

# 🎮 あそんで勝負しよう

:::

**⚔ 勝負** … 何秒生きのこれるかな？

1. 緑の旗でスタート
2. ゲームオーバーになったときの「**生きのこり**」が記録
3. となりの人と交代して、記録をくらべる
4. 3回やって、いちばんよい記録で勝負！

:::

📷 ここに画面：ゲームオーバーになって、「生きのこり」が表示されているステージ

---

# 💪 改造してみよう

:::

1. いん石を**5つ**にふやす
2. 生きのこりが10をこえたら、いん石を速くする
3. ネコが上下にも動けるようにする
4. 「**ライフ**」を作って、3回までふれてもだいじょうぶにする
5. いん石の大きさを、上にもどるたびに乱数で変える

:::

📷 ここに画面：いん石が5つ落ちてくるステージ
