# ⑥ ピンポン

パターン：はね返る

*Scratch 体験ワークショップ*

---

# なにをするの？

:::

はね返る**ボール**を、**バー**で打ち返そう。

- ボールは、かべではね返る
- バーは、**マウス**で左右に動かす
- 下に落としたら、おしまい

> このゲームのポイントは「**はね返る**」だよ。

:::

📷 ここに画面：完成したピンポン（ボールと、下のほうにバー、いちばん下に赤い線）

---

# このゲームのしくみ

:::

**登場するもの**

- **ボール**（Ball）… 動きつづけて、はね返る
- **バー**（Paddle）… マウスで左右に動く
- **背景** … いちばん下に赤い線

**ルール**

1. ボールは、かべにふれるとはね返る
2. バーにふれたら、上へ打ち返す。得点が 1 ふえる
3. 赤い線にふれたら、おしまい

:::

📷 ここに画面：ボール・バー・赤い線に、それぞれの役わりを書きこんだもの

---

# じゅんび

:::

1. 「**スプライトを選ぶ**」で、**Ball** と **Paddle** を出す
2. ネコは、右クリックして「**削除**」
3. ステージの「**背景**」タブで、いちばん下に**赤い線**を「**四角形**」でかく
4. 変数「**得点**」を作る

:::

📷 ここに画面：Ball と Paddle がいて、下に赤い線をかいたステージ

---

# バー：マウスで左右に動く

:::

1. 緑の旗 →「**ずっと**」
2. 中に「**マウスのポインター へ行く**」
3. そのすぐ下に「**y座標を -140 にする**」

> マウスの場所へ行ってから、**すぐに高さだけもどす**。だから、横にだけついてくるんだ。

:::

📷 ここにブロックの画面：バーのスクリプト

---

# ボール：動きはじめ

:::

1. 緑の旗 →「**得点 を 0 にする**」
2. 「**x座標を 0 、y座標を 100 にする**」
3. 「**（150 から 210 までの乱数） 度に向ける**」
4. その下に「**ずっと**」をつなぐ

> 150〜210 度は、**下向き**だよ。b1 の「向き」を思い出そう（180 が下）。

:::

📷 ここにブロックの画面：ボールのスクリプトの前半（ずっとの上まで）

---

# ボール：はね返る

:::

「**ずっと**」の中に、この順に入れよう。

1. 「**10 歩動かす**」
2. 「**もし 〇色に触れた なら**」（赤い線）→「**ざんねん! と 1 秒言う**」→「**すべてを止める**」
3. 「**もし Paddle に触れた なら**」→「**（-40 から 40 までの乱数） 度に向ける**」→ 得点を 1 ふやす
4. 「**もし端に着いたら、跳ね返る**」

> -40〜40 度は、**上向き**。バーに当たると、上のどこかへ飛んでいくよ。

:::

📷 ここにブロックの画面：ボールのスクリプトの「ずっと」の中

---

# 🎮 あそんで勝負しよう

:::

**⚔ 勝負** … 何回打ち返せるかな？

1. 緑の旗でスタート
2. 落としたときの「**得点**」が記録
3. となりの人と交代して、記録をくらべる
4. 3回やって、いちばんよい記録で勝負！

:::

📷 ここに画面：「ざんねん!」と言って止まったステージと「得点」

---

# 💪 改造してみよう

:::

1. 打ち返したら音を鳴らす
2. 歩数を変数にして、打ち返すたびに速くする
3. ステージの上のほうに**ブロック**を置いて、当たったら消す
4. ボールを2つにする（「**複製**」）
5. バーを、マウスではなく矢印キーで動かす

:::

📷 ここに画面：ボールが2つになったステージ
