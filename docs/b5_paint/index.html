# ⑤ 絵をかこう（ペイントエディター）

自分だけのキャラクターと背景

*Scratch 体験ワークショップ*

---

# なにをするの？

:::

Scratch には、絵をかく道具がついているよ。**ペイントエディター**というんだ。

- 道具と色の**使いかた**
- いまある絵の**形**や**色**を変える
- 新しい**スプライト**や**背景**をかく

> 自分でかいた絵が動くと、作品がぐっと**オリジナル**になるよ。

:::

![形と色を変えたネコと、自分でかいた背景](image/index/02_stage.png)

---

# ペイントエディターをひらこう

:::

1. 右下で、絵をかきたいスプライトをクリック
2. 左上の「**コスチューム**」タブをクリック

- **左** … コスチュームの一覧
- **まん中** … 絵をかく場所
- **絵をかく場所の左** … 道具

:::

![これがペイントエディター](image/index/03_editor.png)

---

# 道具をおぼえよう

:::

- 「**選択**」… えらんで動かす・大きさを変える
- 「**形を変える**」… 形を少しずつ直す
- 「**筆**」… 自由に線をかく
- 「**消しゴム**」… 消す
- 「**塗りつぶし**」… 色をぬる
- 「**テキスト**」… 文字を書く
- 「**直線**」「**円**」「**四角形**」… 形をかく

> 道具にマウスをのせると、名前が出るよ。

:::

![道具のボタンと名前](image/index/04_tools.png)

---

# 色をえらぼう

:::

上にある2つの四角で、色を決めるよ。

- 「**塗りつぶし**」… 中の色
- 「**枠線**」… ふちの色。となりの数字で太さ

四角をクリックすると、3つのつまみが出るよ。

- 「**色**」… 赤・青・緑など
- 「**鮮やかさ**」… こい・うすい
- 「**明るさ**」… 明るい・暗い

:::

![四角をクリックすると、3つのつまみが出るよ](image/index/05_color.png)

---

# まちがえたら

:::

まちがえても、だいじょうぶ。

- 「**取り消し**」… 1つ前にもどす
- 「**やり直し**」… 取り消したのをやめる

> どちらも、コスチュームの名前のとなりにある**矢印のボタン**だよ。何回でももどせるよ。

:::

![コスチュームの名前のとなりにある、2つの矢印のボタン](image/index/06_undo.png)

---

# 形を変えてみよう

:::

ゼロからかかなくても、**いまある絵を少し変える**だけで、オリジナルになるよ。

1. 道具の「**形を変える**」をクリック
2. 変えたいところ（例：耳）をクリックすると、**点**がたくさん出る
3. 点をドラッグすると、形が変わる

> 先にコスチュームを右クリックして「**複製**」しておくと、もとの絵ものこせるよ。

:::

![耳の点を引っぱって、とがった耳にしたよ](image/index/07_reshape.png)

---

# 色を変えてみよう

:::

色を変えるだけでも、ぜんぜんちがうキャラクターになるよ。

1. 道具の「**塗りつぶし**」をクリック
2. 上の「**塗りつぶし**」の四角で、色をえらぶ
3. 色を変えたいところ（例：顔）をクリック

> まちがえたら「**取り消し**」でもどせるよ。

:::

![顔だけ水色にしたよ](image/index/08_fill.png)

---

# 新しいスプライトをかこう

:::

1. 右下の「**スプライトを選ぶ**」に**マウスをのせる**
2. 上に出てきたメニューの「**描く**」（筆のマーク）をクリック
3. 白い絵をかく場所が出るので、絵をかく

> 絵をかく場所のまん中にある **⊕ のしるし**のあたりにかこう。回したときに、そこを中心に回るよ。

:::

![「描く」をクリックすると、まっ白な絵をかく場所が出るよ](image/index/10_draw.png)

---

# かいた絵をあとで直そう

:::

筆でかいた線は、あとから**直せる**よ。

- **色を変える** …「**選択**」で線をクリックして、上の「**塗りつぶし**」で色をえらぶ
- **ぬって変える** …「**塗りつぶし**」で線をクリック
- **動かす** …「**選択**」で線をドラッグ
- **大きさを変える** …「**選択**」で出る四すみの■をドラッグ

> 筆の色は、上の「**塗りつぶし**」の色だよ。太さは、となりの数字で変えられるよ。

:::

![筆でかいた顔。線は1本ずつ、あとから直せるよ](image/index/11_brush.png)

---

# 線の中をぬろう

:::

筆でかこんだところの**中**も、ぬれるよ。

1. 道具の「**塗りつぶし**」をクリック
2. 上の「**塗りつぶし**」の四角で、色をえらぶ
3. 線でかこんだところの**中**をクリック

> ⚠ 線にすき間があると、うまくぬれないよ。すき間をふさいでからぬろう。

:::

![顔の中を黄色でぬったよ](image/index/11_fillinside.png)

---

# 背景をかこう

:::

1. 右下の「**ステージ**」をクリック
2. 左上のタブが「**背景**」に変わる。クリックする
3. 一覧の1枚目（はじめからある白い背景）に絵をかく

> 背景は、ステージ全体の大きさ。「**四角形**」で空と地面をかいてから、木や雲を足すと早いよ。

:::

![「四角形」で、空と地面をかいたよ](image/index/12_backdrop.png)

---

# 🎮 ミニゲーム：お絵かきあてっこ

**⚔ 勝負** … となりの人と、出しあいっこしよう！

1. お題をひとつ決める（どうぶつ・食べもの・のりもの など）
2. 「**描く**」で新しいスプライトを出して、**30秒**で絵をかく
3. となりの人に見せて、何の絵か当ててもらう
4. 当たったら、かいた人とあてた人の両方に1点

> ⚠ 「**テキスト**」で答えを書くのはなし！ 絵だけで伝えよう。

---

# やってみよう

:::

ネコを、自分だけのキャラクターに**変身**させよう。

1. costume1 の形や色を変える
2. costume2 も、同じように変える
3. 「アニメーションしよう」の歩くスクリプトで動かす

> 時間があったら、**背景もかいてみよう**。これで基本編はおしまい！ 次の制御編では、**くりかえし**でプログラムを短くするよ。

:::

![青くして、耳の形も変えた例。costume1 と costume2 の両方を変えたよ](image/index/14_mycat.png)
