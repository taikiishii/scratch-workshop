# ⑤ 絵をかこう（ペイントエディター）

自分だけのキャラクターと背景

*Scratch 体験ワークショップ*

---

# なにをするの？

:::

Scratch には、絵をかく道具がついているよ。**ペイントエディター**というんだ。

- 道具と色の**使いかた**
- 新しい**スプライト**をかく
- **背景**をかく

> 自分でかいた絵が動くと、作品がぐっと**オリジナル**になるよ。

:::

📷 ここに完成したようす：自分でかいたキャラクターと背景のステージの例

---

# ペイントエディターをひらこう

:::

1. 右下で、絵をかきたいスプライトをクリック
2. 左上の「**コスチューム**」タブをクリック

- **左** … コスチュームの一覧
- **まん中** … 絵をかく場所
- **絵をかく場所の左** … 道具

:::

📷 ここに画面：「コスチューム」タブのペイントエディター全体（一覧・絵をかく場所・道具に印）

---

# 道具をおぼえよう

:::

- 「**筆**」… 自由に線をかく
- 「**消しゴム**」… 消す
- 「**塗りつぶし**」… 色をぬる
- 「**円**」「**四角形**」「**直線**」… 形をかく
- 「**テキスト**」… 文字を書く
- 「**選択**」… えらんで動かす・大きさを変える
- 「**形を変える**」… 形を少しずつ直す

> 道具にマウスをのせると、名前が出るよ。

:::

📷 ここに画面：道具のボタンがならんでいるところ（それぞれに名前を書きこむ）

---

# 色をえらぼう

:::

上にある2つの四角で、色を決めるよ。

- 「**塗りつぶし**」… 中の色
- 「**枠線**」… ふちの色。となりの数字で太さ

四角をクリックすると、3つのつまみが出るよ。

- 「**色**」… 赤・青・緑など
- 「**鮮やかさ**」… こい・うすい
- 「**明るさ**」… 明るい・暗い

:::

📷 ここに画面：「塗りつぶし」をクリックして、「色」「鮮やかさ」「明るさ」のつまみが出ているところ

---

# まちがえたら

:::

まちがえても、だいじょうぶ。

- 「**取り消し**」… 1つ前にもどす
- 「**やり直し**」… 取り消したのをやめる

> どちらも、コスチュームの名前のとなりにある**矢印のボタン**だよ。何回でももどせるよ。

:::

📷 ここに画面：コスチューム名のとなりの「取り消し」「やり直し」ボタン（印）

---

# うまく塗れないとき

:::

「**筆**」でかいた線の中を「**塗りつぶし**」しても、色が入らないことがあるよ。

1. 絵をかく場所の左下の「**ビットマップに変換**」をクリック
2. もう一度「**塗りつぶし**」でクリック

> ビットマップにすると、ふつうのお絵かきソフトのように、線でかこんだところに色が入るよ。

:::

📷 ここに画面：左下の「ビットマップに変換」ボタン（印）と、線でかこんだ中に色が入ったところ

---

# 新しいスプライトをかこう

:::

1. 右下の「**スプライトを選ぶ**」に**マウスをのせる**
2. 上に出てきたメニューの「**描く**」（筆のマーク）をクリック
3. 白い絵をかく場所が出るので、絵をかく

> 絵をかく場所の**まん中あたり**にかこう。回したときに、まん中を中心に回るよ。

:::

📷 ここに画面：「スプライトを選ぶ」にマウスをのせて、メニューが出ているところ（「描く」に印）

---

# 背景をかこう

:::

1. 右下の「**ステージ**」をクリック
2. 左上のタブが「**背景**」に変わる。クリックする
3. 一覧の1枚目（はじめからある白い背景）に絵をかく

> 背景は、ステージ全体の大きさ。「**四角形**」で空と地面をかいてから、木や雲を足すと早いよ。

:::

📷 ここに画面：ステージをえらんで「背景」タブをひらいたところ

---

# やってみよう

:::

自分だけのキャラクターを、**歩かせて**みよう。

1. 新しいスプライトをかく
2. 一覧のコスチュームを右クリックして「**複製**」
3. 2枚目の絵を、少しだけ変える（手や足の形など）
4. 「アニメーションしよう」の歩くスクリプトで動かす
5. 背景もかく

> これで基本編はおしまい！ 次の制御編では、**くりかえし**でプログラムを短くするよ。

:::

📷 ここに画面：コスチュームを右クリックして「複製」をえらんでいるところ
