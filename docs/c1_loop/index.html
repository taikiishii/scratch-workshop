# ① くりかえそう

同じ動きは、くりかえしにおまかせ

*Scratch 体験ワークショップ*

---

# なにをするの？

:::

オレンジの「**制御**」のブロックで、同じ動きを何回もさせよう。

- 「**10 回繰り返す**」で、決めた回数だけくりかえす
- 「**ずっと**」で、止めるまでくりかえす
- ネコがマウスを**追いかけてくる**ゲームを作る

:::

📷 ここに完成したようす：「ずっと」の中に「10 歩動かす」「もし端に着いたら、跳ね返る」が入ったスクリプト

---

# 長いプログラムを短くしよう

:::

b2 で作った歩くスクリプト、同じブロックがならんで長かったね。

1. 「**制御**」の「**10 回繰り返す**」をえらぶ
2. 「**次のコスチュームにする**」「**10 歩動かす**」「**0.2 秒待つ**」を**1組だけ**のこす
3. その1組を「**10 回繰り返す**」の**口の中**に入れる
4. 緑の旗で動かす

> 1組書くだけで、10回歩いてくれるよ。

:::

📷 ここにブロックの画面：「10 回繰り返す」の中に「次のコスチュームにする」「10 歩動かす」「0.2 秒待つ」が入ったスクリプト

---

# ブロックのはさみかた

:::

「**10 回繰り返す**」は、口があいた形をしているね。

- 口の**中**のブロック … くりかえす
- 口の**下**につないだブロック … くりかえしが**終わってから**1回だけ動く

> つながったブロックのいちばん上を持って口に近づけると、下のブロックもいっしょに入るよ。

:::

📷 ここにブロックの画面：「10 回繰り返す」の口の中と、下につないだブロック（「こんにちは! と 2 秒言う」など）

---

# ずっと

:::

「**ずっと**」は、**止めるまで**くりかえすブロック。

1. 「**ずっと**」を緑の旗の下につなぐ
2. 中に「**15 度回す**」を入れる
3. 緑の旗をクリック → ネコが回りつづける
4. **赤いボタン**で止める

> 「ずっと」の下には、ブロックをつなげられないよ。終わりがないからね。

:::

📷 ここにブロックの画面：「緑の旗が押されたとき」→「ずっと」の中に「15 度回す」

---

# 行ったり来たり

:::

ネコに、ステージの**はしからはしまで**歩かせよう。

1. 緑の旗の下に「**回転方法を 左右のみ にする**」
2. その下に「**ずっと**」
3. 「ずっと」の中に「**10 歩動かす**」と「**もし端に着いたら、跳ね返る**」

> 「**次のコスチュームにする**」と「**0.1 秒待つ**」も中に入れると、歩きながら行ったり来たりするよ。

:::

📷 ここにブロックの画面：行ったり来たりのスクリプト（回転方法 → ずっと → 10 歩動かす・もし端に着いたら、跳ね返る）

---

# マウスについてくる

:::

1. 緑の旗の下に「**ずっと**」をつなぐ
2. 「**動き**」の「**どこかの場所 へ行く**」を中に入れる
3. 「どこかの場所」の ▼ で「**マウスのポインター**」をえらぶ
4. 緑の旗をクリックして、マウスを動かす

> 「ずっと」の中だから、マウスがどこへ行っても、ずっとついてくるんだ。

:::

📷 ここにブロックの画面：「ずっと」の中に「マウスのポインター へ行く」

---

# 2つのくりかえしのちがい

:::

- 「**10 回繰り返す**」… 回数が**決まっている**。終わったら下のブロックへ進む
- 「**ずっと**」… **終わらない**。赤いボタンで止めるまで続く

> ゲームでは「**ずっと**」をよく使うよ。ゲームのあいだ、ずっとキャラクターを動かしたいからね。

:::

📷 ここにブロックの画面：「10 回繰り返す」と「ずっと」を左右にならべたもの

---

# 🎮 ミニゲーム：ネコから逃げろ

:::

**🏃 追いかけ** … ネコがマウスを追いかけてくるよ。逃げきれるかな？

1. 緑の旗の下に「**ずっと**」をつなぐ
2. 中に「**マウスのポインター へ向ける**」と「**3 歩動かす**」を入れる
3. 緑の旗をクリックして、マウスで逃げる
4. **10秒**つかまらなければ勝ち！（となりの人に数えてもらおう）

> 歩数を大きくすると、ネコが速くなるよ。次の章で、つかまったら止まる**本物のゲーム**にするよ。

:::

📷 ここにブロックの画面：「ずっと」の中に「マウスのポインター へ向ける」「3 歩動かす」

---

# やってみよう

:::

1. 歩くスクリプトを「**10 回繰り返す**」で短くする
2. 行ったり来たりしながら、足も動くようにする
3. 「**ずっと**」の中に「**色 の効果を 25 ずつ変える**」と「**0.1 秒待つ**」を入れて、にじ色のネコにする
4. 「ネコから逃げろ」の歩数を変えて、ちょうどよいむずかしさにする
5. 作った作品を保存する

:::

📷 ここに動いているようす：にじ色に変わりながら行ったり来たりするネコ
